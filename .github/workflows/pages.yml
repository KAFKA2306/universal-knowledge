name: Pages validation and deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate domain configuration
        run: python scripts/validate_project.py
      - name: Validate public source catalog
        run: python scripts/source_intake.py
      - name: Run tests including Pages contract
        run: python -m unittest discover -s tests -v
      - name: Build public Pages artifact
        run: python scripts/build_pages.py --output _site
      - name: Validate artifact for exact commit
        run: python scripts/verify_pages.py --local _site --revision "$GITHUB_SHA"
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy built artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live HTML and manifest for exact commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_pages.py --url "$PAGE_URL" --revision "$GITHUB_SHA"
