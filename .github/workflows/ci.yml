name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate packs and pipeline settings
        run: python scripts/validate_project.py
      - name: Validate public source catalog
        run: python scripts/source_intake.py
      - name: Validate collected primary-source metadata
        run: python scripts/source_intake.py
      - name: Unit and integration fixture tests
        run: python -m unittest discover -s tests -v
